[project]
name = "nexolu-auth"
version = "0.1.0"
description = "Nexolu Auth: identidad centralizada del ecosistema Nexolu. Emite aserciones SSO de vida corta que cada producto verifica localmente y canjea por su credencial nativa."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "cryptography>=43.0",
    "alembic>=1.14",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Las tres que NO estan en los otros servicios core:
    # pyjwt firma la asercion, bcrypt verifica la contrasena (mismo hash que
    # Laravel), jinja2 renderiza la pantalla de login del lado del servidor.
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexolu_auth*"]

# Los templates no son un paquete Python (no tienen __init__.py), asi que
# `packages.find` no los ve y `pip install .` dejaria la imagen sin la
# pantalla de login - un 500 que solo aparece en el contenedor, nunca al
# correr desde el repo.
[tool.setuptools.package-data]
nexolu_auth = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ: el servicio guarda timestamps como UTC "naive" a proposito (convencion
# consistente en todo el modelo de datos, ver core/db/entities.py) para evitar
# el problema de columnas DateTime aware/naive entre SQLite y MySQL.
# B008: `Depends(...)` como valor por defecto es el patron idiomatico de
# FastAPI, no una llamada accidental en tiempo de definicion.
ignore = ["DTZ", "B008"]
