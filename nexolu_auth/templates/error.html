<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ titulo }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f5f7; color: #1f2430; padding: 1.5rem;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 2rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
    p { margin: 0; color: #6b7280; font-size: .9rem; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161a; color: #e5e7eb; }
      .card { background: #1c1f26; box-shadow: none; border: 1px solid #2b303a; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ titulo }}</h1>
    <p>{{ detalle }}</p>
  </main>
</body>
</html>
